name: badge image

on:
  push:
    branches: [main]
    tags: ["badge-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vm:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          src/platforms/esp32/badge/build.sh --vm-only

      - uses: actions/upload-artifact@v7
        with:
          name: vm
          path: src/platforms/esp32/build-badge/out/

  # The IDF container has no Erlang/Elixir, so boot.avm (the standard
  # libraries the VM starts from) comes from a separate host build.
  boot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
          rebar3-version: "3.27.1"
          hexpm-mirrors: |
            https://builds.hex.pm
            https://repo.hex.pm

      - name: Install deps
        run: |
          sudo apt update -y
          sudo apt install -y build-essential cmake gperf zlib1g-dev libmbedtls-dev

      - name: Build boot.avm
        run: |
          cmake -B build .
          make -C build elixir_esp32boot
          mkdir -p out
          cp build/libs/esp32boot/elixir_esp32boot.avm out/boot.avm
          size=$(stat -c%s out/boot.avm)
          [ "$size" -le 557056 ] || { echo "boot.avm $size > 557056"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: boot
          path: out/

  release:
    needs: [vm, boot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: art

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          cp art/vm/* art/boot/* out/
          sha256sum out/* | tee out/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: badge-image
          path: out/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/badge-v')
        uses: softprops/action-gh-release@v3
        with:
          files: out/*
